 }
</style><rect class="bg" x=".5" y=".5" width="939" height="317" rx="14"/><text x="24" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" class="t">How often each player clears a Hard board</text><text x="24" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" class="m">10,000 random 14 × 14 boards with 40 bad neggs. Every player gets the same boards and never clicks a negg it knows is bad.</text><line class="ln" x1="300" x2="300" y1="84" y2="252" stroke-width="1" stroke-opacity=".3"/><text x="300" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" class="m" text-anchor="middle">0%</text><line class="ln" x1="408" x2="408" y1="84" y2="252" stroke-width="1" stroke-opacity=".3"/><text x="408" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" class="m" text-anchor="middle">10%</text><line class="ln" x1="516" x2="516" y1="84" y2="252" stroke-width="1" stroke-opacity=".3"/><text x="516" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" class="m" text-anchor="middle">20%</text><line class="ln" x1="624" x2="624" y1="84" y2="252" stroke-width="1" stroke-opacity=".3"/><text x="624" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" class="m" text-anchor="middle">30%</text><line class="ln" x1="732" x2="732" y1="84" y2="252" stroke-width="1" stroke-opacity=".3"/><text x="732" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" class="m" text-anchor="middle">40%</text><line class="ln" x1="840" x2="840" y1="84" y2="252" stroke-width="1" stroke-opacity=".3"/><text x="840" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" class="m" text-anchor="middle">50%</text><text x="24" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" class="t">This solver</text><text x="24" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" class="m">exact odds, Remaining counter included</text><rect class="acc" x="300" y="100" width="439.56" height="26" rx="4"/><text x="749.56" y="119" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" class="t">40.7%</text><text x="24" y="167" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" class="t">Sure-thing rules, corner guess</text><text x="24" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" class="m">the usual patterns, no odds</text><rect class="bar0" x="300" y="156" width="255.96" height="26" rx="4"/><text x="565.96" y="175" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" class="t">23.7%</text><text x="24" y="223" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" class="t">Sure-thing rules, random guess</text><text x="24" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" class="m">no odds, no corner habit</text><rect class="bar0" x="300" y="212" width="177.12" height="26" rx="4"/><text x="487.12" y="231" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" class="t">16.4%</text><text x="24" y="296" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" class="m">About 1 game in 5 is lost on the very first click, before there is a single number to read. No player can avoid that.</text></svg>