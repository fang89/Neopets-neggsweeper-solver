<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" role="img" aria-label="Worked example: why the safest-looking negg is not 50/50"><style>
 .bg{fill:#ffffff;stroke:#d0d7de} .t{fill:#1f2328} .m{fill:#59636e} .box{fill:#f6f8fa;stroke:#d0d7de}
 .cov{fill:#e5e7eb;stroke:#9ca3af} .egg{fill:#fde68a} .num{fill:#ffffff;stroke:#d0d7de} .ln{stroke:#8c959f}
 .bad{fill:#ef4444} .good{fill:#22c55e} .gb{fill:#dafbe1;stroke:#2da44e} .rb{fill:#ffebe9;stroke:#cf222e} .acc{fill:#0f766e} .bar0{fill:#d0d7de}
 @media (prefers-color-scheme: dark) {
  .bg{fill:#0d1117;stroke:#30363d} .t{fill:#e6edf3} .m{fill:#9198a1} .box{fill:#161b22;stroke:#30363d}
  .cov{fill:#21262d;stroke:#484f58} .num{fill:#161b22;stroke:#30363d} .ln{stroke:#6e7681}
  .gb{fill:#0f2e1b;stroke:#3fb950} .rb{fill:#3a1212;stroke:#f85149} .acc{fill:#2dd4bf} .bar0{fill:#30363d}
 }
</style><rect class="bg" x=".5" y=".5" width="939" height="479" rx="14"/><text x="24" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" class="t">Counting layouts, then weighting them</text><text x="24" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" class="m">A 1 touches A and B; another 1 touches B and C. The rest of the board has 50 covered neggs,</text><text x="24" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" class="m">and the Remaining counter says 10 bad neggs are left in all.</text><rect class="cov" x="60" y="114" width="52" height="52" rx="9"/><ellipse cx="86" cy="142.08" rx="14.040000000000001" ry="17.68" fill="#fde68a"/><ellipse cx="81.32" cy="134.8" rx="3.12" ry="5.2" fill="#fff" fill-opacity=".55"/><text x="86" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t" text-anchor="middle">A</text><rect class="cov" x="122" y="114" width="52" height="52" rx="9"/><ellipse cx="148" cy="142.08" rx="14.040000000000001" ry="17.68" fill="#fde68a"/><ellipse cx="143.32" cy="134.8" rx="3.12" ry="5.2" fill="#fff" fill-opacity=".55"/><text x="148" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t" text-anchor="middle">B</text><rect class="cov" x="184" y="114" width="52" height="52" rx="9"/><ellipse cx="210" cy="142.08" rx="14.040000000000001" ry="17.68" fill="#fde68a"/><ellipse cx="205.32" cy="134.8" rx="3.12" ry="5.2" fill="#fff" fill-opacity=".55"/><text x="210" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" class="t" text-anchor="middle">C</text><path class="ln" fill="none" stroke-width="2" d="M86 200 v10 h62 v-10 M148 218 v10 h62 v-10"/><text x="117" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#2563eb" text-anchor="middle">1</text><text x="179" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#2563eb" text-anchor="middle">1</text><text x="60" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" class="m">one bad negg among A, B</text><text x="60" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" class="m">one bad negg among B, C</text><rect class="box" x="290" y="98" width="300" height="214" rx="12"/><text x="308" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t">Layout 1: only B is bad</text><rect class="good" x="308" y="142" width="44" height="44" rx="8"/><text x="330" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">A</text><rect class="bad" x="360" y="142" width="44" height="44" rx="8"/><text x="382" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">B</text><rect class="good" x="412" y="142" width="44" height="44" rx="8"/><text x="434" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">C</text><text x="308" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" class="t">uses 1 bad negg, so 9 are left</text><text x="308" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" class="t">to hide among the other 50:</text><text x="308" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t">C(50, 9) = 2,505,433,700</text><text x="308" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" class="m">ways to fill the rest</text><rect class="box" x="612" y="98" width="300" height="214" rx="12"/><text x="630" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t">Layout 2: A and C are bad</text><rect class="bad" x="630" y="142" width="44" height="44" rx="8"/><text x="652" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">A</text><rect class="good" x="682" y="142" width="44" height="44" rx="8"/><text x="704" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">B</text><rect class="bad" x="734" y="142" width="44" height="44" rx="8"/><text x="756" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">C</text><text x="630" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" class="t">uses 2 bad neggs, so 8 are left</text><text x="630" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" class="t">to hide among the other 50:</text><text x="630" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t">C(50, 8) = 536,878,650</text><text x="630" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" class="m">ways to fill the rest</text><rect class="gb" x="24" y="334" width="892" height="122" rx="12"/><text x="44" y="364" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t">Result</text><text x="44" y="394" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" class="t">B is bad 82% of the time, A and C 18% each, every other covered negg 18%.</text><text x="44" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" class="m">Counting the two layouts as equal would say B is 50/50. It isn't: the layout that spends fewer bad neggs leaves</text><text x="44" y="440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" class="m">more of them for the rest of the board, and there are 4.7× as many ways to place them there.</text></svg>