<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-label="What runs where: everything stays in the game tab"><style>
 .bg{fill:#ffffff;stroke:#d0d7de} .t{fill:#1f2328} .m{fill:#59636e} .box{fill:#f6f8fa;stroke:#d0d7de}
 .cov{fill:#e5e7eb;stroke:#9ca3af} .egg{fill:#fde68a} .num{fill:#ffffff;stroke:#d0d7de} .ln{stroke:#8c959f}
 .bad{fill:#ef4444} .good{fill:#22c55e} .gb{fill:#dafbe1;stroke:#2da44e} .rb{fill:#ffebe9;stroke:#cf222e} .acc{fill:#0f766e} .bar0{fill:#d0d7de}
 @media (prefers-color-scheme: dark) {
  .bg{fill:#0d1117;stroke:#30363d} .t{fill:#e6edf3} .m{fill:#9198a1} .box{fill:#161b22;stroke:#30363d}
  .cov{fill:#21262d;stroke:#484f58} .num{fill:#161b22;stroke:#30363d} .ln{stroke:#6e7681}
  .gb{fill:#0f2e1b;stroke:#3fb950} .rb{fill:#3a1212;stroke:#f85149} .acc{fill:#2dd4bf} .bar0{fill:#30363d}
 }
</style><rect class="bg" x=".5" y=".5" width="939" height="379" rx="14"/><text x="24" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" class="t">What runs where</text><text x="24" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" class="m">One click on the bookmark turns the game tab into this. Nothing is sent anywhere: the board is read and solved in the tab.</text><rect class="box" x="24" y="84" width="892" height="272" rx="14"/><text x="44" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" class="t">Game tab</text><text x="122" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" class="m">· neopets.com, after one click on the bookmark</text><rect class="bg" x="44" y="126" width="852" height="58" rx="10"/><rect class="acc" x="44" y="126" width="6" height="58" rx="3"/><text x="64" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" class="t">Helper (the bookmark)</text><text x="64" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" class="m">stays in the outer page, so it survives every reload of the game · draws the corner card and the colours</text><rect class="bg" x="44" y="198" width="560" height="140" rx="10"/><text x="64" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" class="t">The game, in a full-page frame</text><text x="64" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" class="m">same site, so the helper can read it · every negg click reloads only the frame</text><rect class="num" x="64" y="258" width="28" height="22" rx="5"/><text x="78" y="274" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2563eb" text-anchor="middle">1</text><rect class="cov" x="96" y="258" width="28" height="22" rx="5"/><rect class="cov" x="128" y="258" width="28" height="22" rx="5"/><rect class="num" x="160" y="258" width="28" height="22" rx="5"/><text x="174" y="274" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#16a34a" text-anchor="middle">2</text><rect class="num" x="64" y="284" width="28" height="22" rx="5"/><text x="78" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2563eb" text-anchor="middle">1</text><rect class="num" x="96" y="284" width="28" height="22" rx="5"/><text x="110" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#16a34a" text-anchor="middle">2</text><rect class="cov" x="128" y="284" width="28" height="22" rx="5"/><rect class="cov" x="160" y="284" width="28" height="22" rx="5"/><rect class="num" x="64" y="310" width="28" height="22" rx="5"/><rect class="num" x="96" y="310" width="28" height="22" rx="5"/><text x="110" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#2563eb" text-anchor="middle">1</text><rect class="good" x="128" y="310" width="28" height="22" rx="5"/><rect class="bad" x="160" y="310" width="28" height="22" rx="5"/><text x="210" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" class="t">1. frame loads</text><text x="210" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" class="t">2. read the board from the page HTML</text><text x="210" y="324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" class="t">3. solve (a few ms) and colour the neggs</text><rect class="rb" x="620" y="198" width="276" height="140" rx="10"/><text x="640" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" class="t">It never</text><text x="640" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" class="t">✕  clicks a negg for you</text><text x="640" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" class="t">✕  sends the board anywhere</text><text x="640" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" class="t">✕  changes the game itself</text><text x="640" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" class="m">× on the card puts the page back</text></svg>